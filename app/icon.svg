<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo dourado (sem fundo branco) -->
  <circle cx="50" cy="50" r="50" fill="#B8924A"/>
  <!-- Moldura branca quadrada interna -->
  <rect x="12" y="12" width="76" height="76" fill="white"/>
  <!-- Quadrado dourado interno -->
  <rect x="20" y="20" width="60" height="60" fill="#B8924A"/>
  <!-- Barra esquerda do h -->
  <rect x="30" y="26" width="9" height="48" rx="1.5" fill="white"/>
  <!-- Crossbar -->
  <rect x="30" y="49" width="32" height="9" rx="1.5" fill="white"/>
  <!-- Perna direita -->
  <rect x="53" y="49" width="9" height="25" rx="1.5" fill="white"/>
</svg>
