<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Círculo dourado de fundo -->
  <circle cx="100" cy="100" r="100" fill="#B8935A"/>
  <!-- Moldura branca quadrada -->
  <rect x="18" y="18" width="164" height="164" fill="white"/>
  <!-- Área dourada interna -->
  <rect x="30" y="30" width="140" height="140" fill="#B8935A"/>
  <!-- Barra esquerda do "h" (altura total do quadrado interno) -->
  <rect x="52" y="42" width="22" height="116" fill="white"/>
  <!-- Crossbar horizontal -->
  <rect x="52" y="86" width="90" height="20" fill="white"/>
  <!-- Perna direita (do crossbar para baixo) -->
  <rect x="120" y="86" width="22" height="72" fill="white"/>
</svg>
