<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo dourado -->
  <rect width="100" height="100" fill="#B8924A"/>
  <!-- Moldura branca espessa -->
  <rect x="9" y="9" width="82" height="82" fill="white"/>
  <!-- Quadrado dourado interno -->
  <rect x="17" y="17" width="66" height="66" fill="#B8924A"/>
  <!-- Barra esquerda do h (altura total do quadrado) -->
  <rect x="28" y="23" width="10" height="54" rx="1.5" fill="white"/>
  <!-- Crossbar no meio -->
  <rect x="28" y="47" width="36" height="10" rx="1.5" fill="white"/>
  <!-- Perna direita (do crossbar até a base) -->
  <rect x="54" y="47" width="10" height="30" rx="1.5" fill="white"/>
</svg>
